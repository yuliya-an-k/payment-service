spring:
  application:
    name: payment-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_URL:localhost:5444/payment_service}
    password: ${DB_PASSWORD:123}
    username: ${DB_USERNAME:postgres}
    jpa:
      hibernate:
        ddl-auto: validate
server:
  port: 8086